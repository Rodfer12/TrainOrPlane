<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Compare train and plane travel across Europe and Asia.">
	<title>Train or Plane</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main>
		<section class="hero" aria-labelledby="page-title">
			<p class="eyebrow">Travel smarter</p>
			<h1 id="page-title">Train or plane?</h1>
			<p class="hero__text">
				Compare the best way to get between cities across Europe and Asia.
			</p>
			<a class="button" href="#app">Open the trip planner <span aria-hidden="true">→</span></a>
		</section>

		<section class="app" id="app" aria-labelledby="app-title">
			<div>
				<p class="eyebrow">Trip planner</p>
				<h2 id="app-title">Choose your route</h2>
				<p>Interactive route comparisons will appear here.</p>
			</div>
		</section>
	</main>
</body>
</html>
